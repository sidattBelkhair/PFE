apiVersion: 1

groups:
  - orgId: 1
    name: RSS BANK Security Alerts
    folder: SOC
    interval: 30s
    rules:

      - uid: alert-sqli-rss
        title: SQL Injection Detected
        condition: C
        noDataState: OK
        execErrState: OK
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: loki-main
            model:
              expr: 'sum by (app) (count_over_time({job="django-security", event="SQL_INJECTION"}[5m]))'
              queryType: instant
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              settings:
                mode: dropNN
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
              refId: C
        for: 0s
        labels:
          severity: critical
        annotations:
          summary: "SQL Injection sur {{ $labels.app }}"
          description: "{{ $values.B.Value }} tentative(s) SQL Injection en 5 min sur {{ $labels.app }}. Dashboard: http://198.199.70.48:3000/d/rss-bank-soc?var-app={{ $labels.app }}"

