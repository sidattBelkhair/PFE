
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /var/positions/positions.yaml

clients:
  # Envoie les logs au Loki distant (droplet SOC)
  - url: http://${SOC_HOST}:3100/loki/api/v1/push

scrape_configs:
  - job_name: django-security
    static_configs:
      - targets: [localhost]
        labels:
          job: django-security
          app: rss-bank
          env: production
          __path__: /var/log/django/security.log
    pipeline_stages:
      - json:
          expressions:
            ts: ts
            event: event
            ip: ip
      - labels:
          event:
          ip:
      - timestamp:
          source: ts
          format: "2006-01-02T15:04:05Z"
          fallback_formats:
            - RFC3339
            - RFC3339Nano

  - job_name: django-access
    static_configs:
      - targets: [localhost]
        labels:
          job: django-access
          app: rss-bank
          env: production
          __path__: /var/log/django/access.log
    pipeline_stages:
      - json:
          expressions:
            ts: ts
            method: method
            status: status
            ip: ip
            path: path
      - labels:
          method:
          status:
          ip:
      - timestamp:
          source: ts
          format: "2006-01-02T15:04:05Z"
          fallback_formats:
            - RFC3339
            - RFC3339Nano