name: sedad_bank
description: RSS Bank Mobile
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  dio: ^5.4.0
  provider: ^6.1.1
  go_router: ^13.0.0
  shared_preferences: ^2.2.2
  intl: ^0.18.1
  flutter_svg: ^2.0.9
  qr_flutter: ^4.1.0
  mobile_scanner: ^3.5.6
  hive_flutter: ^1.1.0
  share_plus: ^7.2.2
  path_provider: ^2.1.4
  http: ^1.2.0
  flutter_appauth: ^6.0.0
  flutter_secure_storage: ^9.2.2
  flutter_secure_storage_linux: ^1.2.2
  image_picker: ^1.0.7
  crypto: ^3.0.3
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icon/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#1A3A8A"
  adaptive_icon_foreground: "assets/icon/logo.png"
